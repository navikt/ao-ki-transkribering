apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-whisper
  namespace: vllm
  labels:
    app: vllm-whisper
spec:
  # Keep one GPU request active, including outside office hours.
  replicas: 1
  selector:
    matchLabels:
      app: vllm-whisper
  template:
    metadata:
      labels:
        app: vllm-whisper
    spec:
      serviceAccountName: vllm
      securityContext:
        fsGroup: 10001
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-l4
      tolerations:
        - key: nvidia.com/gpu
          value: present
          effect: NoSchedule
      # Keep the legacy deployment/service name so GPU allocation and TLS IP stay stable.
      initContainers:
        - name: last-ned-modell
          image: google/cloud-sdk:slim
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              mkdir -p /models/nemotron-3.5-asr-streaming-0.6b
              BASE=gs://ao-ki-taskforce-prod-2472-modeller/nemotron/ea30d66debe3740a08b573244286791d423d6b3e
              gcloud storage cp \
                "$BASE/config.json" \
                "$BASE/generation_config.json" \
                "$BASE/model.safetensors" \
                "$BASE/processor_config.json" \
                "$BASE/tokenizer.json" \
                "$BASE/tokenizer_config.json" \
                /models/nemotron-3.5-asr-streaming-0.6b/
          volumeMounts:
            - name: modeller
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: vllm
          # Transformers RNNT server, retaining the existing audio API contract.
          image: europe-west4-docker.pkg.dev/ao-ki-taskforce-prod-2472/vllm/nemotron-asr:20261013
          command: ["python", "-m", "uvicorn"]
          args:
            - worker.nemotron_api:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --no-access-log
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: modeller
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: modeller
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-whisper
  namespace: vllm
  annotations:
    # Internal LB — reachable from Cloud Run (Direct VPC egress) but not public internet.
    networking.gke.io/load-balancer-type: "Internal"
spec:
  selector:
    app: vllm-whisper
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: LoadBalancer
  # IP reserved by Terraform. Get it with:
  #   terraform -chdir=terraform/gke output -raw vllm_whisper_ilb_ip
  # Or run: scripts/apply-k8s.sh (substitutes automatically)
  loadBalancerIP: ""  # filled by scripts/apply-k8s.sh
