apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-whisper
  namespace: vllm
  labels:
    app: vllm-whisper
spec:
  # Keep one GPU request active, including outside office hours.
  replicas: 1
  selector:
    matchLabels:
      app: vllm-whisper
  template:
    metadata:
      labels:
        app: vllm-whisper
    spec:
      serviceAccountName: vllm
      securityContext:
        fsGroup: 10001
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-l4
      tolerations:
        - key: nvidia.com/gpu
          value: present
          effect: NoSchedule
      # Reuse the existing speech GPU and authenticated service address.
      initContainers:
        - name: last-ned-modell
          image: google/cloud-sdk:slim
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              mkdir -p /models/nb-whisper-large
              BASE=gs://ao-ki-taskforce-prod-2472-modeller/whisper/nb-whisper-large
              gcloud storage cp \
                "$BASE/added_tokens.json" \
                "$BASE/config.json" \
                "$BASE/generation_config.json" \
                "$BASE/merges.txt" \
                "$BASE/model-00001-of-00002.safetensors" \
                "$BASE/model-00002-of-00002.safetensors" \
                "$BASE/model.safetensors.index.json" \
                "$BASE/preprocessor_config.json" \
                "$BASE/special_tokens_map.json" \
                "$BASE/tokenizer.json" \
                "$BASE/tokenizer_config.json" \
                "$BASE/vocab.json" \
                /models/nb-whisper-large/
              mkdir -p /models/nemotron-diarization
              DIAR=gs://ao-ki-taskforce-prod-2472-modeller/nemotron-diarization/f667ed73aee57d40cc39428eb768b4fd87a0a29e
              gcloud storage cp "$DIAR/config.json" "$DIAR/processor_config.json" \
                "$DIAR/model.safetensors" /models/nemotron-diarization/
          volumeMounts:
            - name: modeller
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: vllm
          # Self-hosted Whisper transcription and separate Nemotron speaker model.
          image: europe-west4-docker.pkg.dev/ao-ki-taskforce-prod-2472/vllm/whisper-diarization:20261014-runtime-comparison
          command: ["python", "-m", "uvicorn"]
          env:
            - name: SPEECH_ASR_BACKEND
              value: faster-whisper
            - name: SPEECH_MODEL_NAME
              value: nb-whisper-large
            - name: WHISPER_MODELL
              value: /models/nb-whisper-large
            - name: SPEECH_INFERENCE_CONCURRENCY
              value: "2"
          args:
            - worker.nemotron_api:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --no-access-log
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: modeller
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: modeller
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-whisper
  namespace: vllm
  annotations:
    # Internal LB — reachable from Cloud Run (Direct VPC egress) but not public internet.
    networking.gke.io/load-balancer-type: "Internal"
spec:
  selector:
    app: vllm-whisper
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: LoadBalancer
  # IP reserved by Terraform. Get it with:
  #   terraform -chdir=terraform/gke output -raw vllm_whisper_ilb_ip
  # Or run: scripts/apply-k8s.sh (substitutes automatically)
  loadBalancerIP: ""  # filled by scripts/apply-k8s.sh
