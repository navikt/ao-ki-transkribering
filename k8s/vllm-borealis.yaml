apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-borealis
  namespace: vllm
  labels:
    app: vllm-borealis
spec:
  # Keep one GPU request active, including outside office hours.
  replicas: 1
  selector:
    matchLabels:
      app: vllm-borealis
  template:
    metadata:
      labels:
        app: vllm-borealis
    spec:
      serviceAccountName: vllm
      securityContext:
        fsGroup: 10001
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-l4
      tolerations:
        - key: nvidia.com/gpu
          value: present
          effect: NoSchedule
      initContainers:
        - name: last-ned-modell
          image: google/cloud-sdk:slim
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              mkdir -p /models/borealis-12b
              BASE=gs://ao-ki-taskforce-prod-2472-modeller/borealis-12b-gguf/8c53f991d8d88a9f70aa7834732aaa327d3862e0
              gcloud storage cp "$BASE/borealis-12b-Q8_0.gguf" "$BASE/LICENSE" /models/borealis-12b/
              echo "ba3413bfbdcaf1d6bb54b0e4ea39e62e9cb10d1fb110e33901c38d4d9deaad04  /models/borealis-12b/borealis-12b-Q8_0.gguf" | sha256sum -c -
          volumeMounts:
            - name: modeller
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
      containers:
        - name: vllm
          # Keep the service/container name stable for existing deployment scripts.
          # This lightweight adapter owns TLS/auth; inference is loopback-only.
          image: europe-west4-docker.pkg.dev/ao-ki-taskforce-prod-2472/vllm/llama-api:20261014-q8
          command: ["python", "-m", "uvicorn"]
          args:
            - worker.llama_api:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --no-access-log
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts: []
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            # Model loading takes ~36 sec from GCS + warm-up time
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          env:
            # GKE mounts its driver here; the CUDA image only includes CUDA's own libs.
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64:/usr/local/cuda/lib64
          args:
            - --model
            - /models/borealis-12b/borealis-12b-Q8_0.gguf
            - --alias
            - borealis-12b
            - --host
            - "127.0.0.1"
            - --port
            - "8001"
            - --n-gpu-layers
            - "99"
            - --device
            - CUDA0
            - --ctx-size
            - "65536"
            - --parallel
            - "2"
            - --batch-size
            - "512"
            - --ubatch-size
            - "512"
            - --flash-attn
            - "on"
            - --jinja
            - --no-context-shift
            - --no-webui
            - --log-verbosity
            - "0"
          resources:
            requests:
              cpu: "4"
              memory: 20Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: modeller
              mountPath: /models
              readOnly: true
          startupProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8001/health"]
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 90
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8001/health"]
            periodSeconds: 30
            timeoutSeconds: 6
            failureThreshold: 5
      volumes:
        - name: modeller
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-borealis
  namespace: vllm
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  selector:
    app: vllm-borealis
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: LoadBalancer
  # IP reserved by Terraform. Get it with:
  #   terraform -chdir=terraform/gke output -raw vllm_borealis_ilb_ip
  # Or run: scripts/apply-k8s.sh (substitutes automatically)
  loadBalancerIP: ""  # filled by scripts/apply-k8s.sh
