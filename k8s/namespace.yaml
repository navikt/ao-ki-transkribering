apiVersion: v1
kind: Namespace
metadata:
  name: vllm
---
# Kubernetes service account linked to the GCP SA via Workload Identity.
# Binding lives in terraform/gke/iam.tf (google_service_account_iam_member).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: vllm
  annotations:
    iam.gke.io/gcp-service-account: vllm-pod@ao-ki-taskforce-prod-2472.iam.gserviceaccount.com
