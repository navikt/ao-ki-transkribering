name: transkriberit-langfuse

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:?Run scripts/langfuse-pilot.py up first}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?Missing pilot secrets}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Missing pilot secrets}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_DISABLE_SIGNUP_ONBOARDING: "true"
  LANGFUSE_IN_APP_AGENT_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Missing pilot secrets}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Missing pilot secrets}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_PASSWORD:?Missing pilot secrets}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_PASSWORD:?Missing pilot secrets}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *dependencies
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_SESSION_SECRET:?Missing pilot secrets}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: transkriberit-pilot
      LANGFUSE_INIT_ORG_NAME: Transkriberit Pilot
      LANGFUSE_INIT_PROJECT_ID: transkriberit-pilot
      LANGFUSE_INIT_PROJECT_NAME: Transkriberit Pilot
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Missing pilot secrets}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Missing pilot secrets}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_PILOT_EMAIL:?Missing pilot secrets}
      LANGFUSE_INIT_USER_NAME: Pilot
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_PILOT_PASSWORD:?Missing pilot secrets}

  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: *dependencies
    environment: *langfuse-env

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Missing pilot secrets}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "langfuse"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Missing pilot secrets}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Missing pilot secrets}
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?Missing pilot secrets}", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_STORAGE_PASSWORD:?Missing pilot secrets}
    volumes: ["objects:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  redis:
  objects:
