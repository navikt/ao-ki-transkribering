apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: ao-ki-transkribering
  namespace: ao-ki-taskforce
  labels:
    team: ao-ki-taskforce
spec:
  image: {{image}}
  port: 8765

  ingresses:
    - https://ao-ki-transkribering.intern.dev.nav.no

  # Single replica — real-time WebSocket state (Whisper model + VAD buffer)
  # is process-local. Scale horizontally only after session affinity is solved.
  replicas:
    min: 1
    max: 1

  # The API pod carries faster-whisper for real-time WebSocket transcription.
  # Batch transcription is delegated to the GPU cluster (TRANSKRIPSJON_BACKEND=remote).
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi   # No CPU limits — Nav convention

  liveness:
    path: /isAlive
    initialDelay: 10
  startup:
    path: /isAlive
    initialDelay: 5
    failureThreshold: 30
  readiness:
    path: /isReady
    initialDelay: 5
    failureThreshold: 10

  azure:
    application:
      enabled: true
    sidecar:
      enabled: true
      autoLogin: true

  # accessPolicy.outbound.external: add GPU cluster hostnames here once provisioned
  # - host: <model-worker hostname>
  # - host: <ollama hostname>

  env:
    - name: TRANSKRIPSJON_BACKEND
      value: remote
    - name: START_LOKAL_WORKER
      value: "false"
    # TODO: move these to Nais secrets once GPU cluster URLs are known
    - name: TRANSKRIPSJON_SERVICE_URL
      value: "http://TODO-model-worker:9000"
    - name: OLLAMA_URL
      value: "http://TODO-ollama:11434"
    - name: WHISPER_MODELL
      value: NbAiLab/nb-whisper-medium
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: ECAPA_CACHE
      value: /app/.cache/speechbrain

  observability:
    autoInstrumentation:
      enabled: false
    logging:
      destinations:
        - id: loki
