apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: ao-ki-transkribering
  namespace: ao-ki-taskforce
  labels:
    team: ao-ki-taskforce
spec:
  image: {{image}}
  port: 8765
  prometheus:
    enabled: true
    path: /metrics
    port: "9091"

  ingresses:
    - https://ao-ki-transkribering.intern.nav.no
    - https://ao-ki-transkribering.ansatt.nav.no

  replicas:
    min: 1
    max: 1

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

  liveness:
    path: /isAlive
    initialDelay: 10
  startup:
    path: /isAlive
    initialDelay: 5
    failureThreshold: 30
  readiness:
    path: /isReady
    initialDelay: 10
    failureThreshold: 10

  azure:
    application:
      enabled: true
      allowAllUsers: true
    sidecar:
      enabled: true
      autoLogin: true

  accessPolicy:
    outbound:
      rules:
        - application: ao-ki-langfuse
      external:
        - host: litellm-ohuqkjyjvq-ez.a.run.app
        - host: ao-ki-langfuse.intern.nav.no

  envFrom:
    - secret: ao-ki-transkribering-secrets
    - secret: ao-ki-model-api
    - secret: ao-ki-langfuse-client

  env:
    - name: LANGFUSE_ENABLED
      value: "true"
    - name: LANGFUSE_BASE_URL
      value: "https://ao-ki-langfuse.intern.nav.no"
    - name: LANGFUSE_ENVIRONMENT
      value: "prod"
    - name: METRICS_ENABLED
      value: "true"
    - name: METRICS_PORT
      value: "9091"
    - name: METRICS_HOST
      value: "0.0.0.0"
    - name: AUTH_REQUIRED
      value: "true"
    - name: MODEL_API_IAM_AUTH
      value: "true"
    - name: JOB_RETENTION_SECONDS
      value: "21600"
    - name: TRANSKRIPSJON_BACKEND
      value: remote
    - name: START_LOKAL_WORKER
      value: "false"
    - name: LLM_BACKEND
      value: openai
    - name: AI_PROXY_URL
      value: "https://litellm-ohuqkjyjvq-ez.a.run.app"
    - name: TRANSKRIPSJON_SERVICE_URL
      value: "https://litellm-ohuqkjyjvq-ez.a.run.app"
    - name: TRANSKRIPSJON_API_PATH
      value: "/v1/audio/transcriptions"
    - name: TRANSKRIPSJON_MODELL
      value: "nb-whisper-large"
    - name: REMOTE_DIARIZATION_MODEL
      value: "nvidia/Nemotron-3-Diarization"
    - name: LLM_MODELL
      value: "borealis-4b"
    - name: LLM_MAX_TOKENS
      value: "1024"
    - name: LLM_CONTEXT_TOKENS
      value: "32768"
    - name: WHISPER_MODELL
      value: NbAiLab/nb-whisper-medium
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: ECAPA_CACHE
      value: /app/.cache/speechbrain

  observability:
    autoInstrumentation:
      enabled: false
    logging:
      destinations:
        - id: loki
