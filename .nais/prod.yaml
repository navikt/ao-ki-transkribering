apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: ao-ki-transkribering
  namespace: ao-ki-taskforce
  labels:
    team: ao-ki-taskforce
spec:
  image: {{image}}
  port: 8765

  ingresses:
    - https://ao-ki-transkribering.intern.nav.no

  replicas:
    min: 1
    max: 1

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

  liveness:
    path: /isAlive
    initialDelay: 10
  startup:
    path: /isAlive
    initialDelay: 5
    failureThreshold: 30
  readiness:
    path: /isReady
    initialDelay: 10
    failureThreshold: 10

  azure:
    application:
      enabled: true
    sidecar:
      enabled: true
      autoLogin: true

  # accessPolicy.outbound.external:
  # - host: <litellm-cloud-run-hostname>

  env:
    - name: TRANSKRIPSJON_BACKEND
      value: remote
    - name: START_LOKAL_WORKER
      value: "false"
    - name: AI_PROXY_URL
      value: "https://TODO-litellm-xxxxxxxx-ew.a.run.app"
    - name: AI_PROXY_API_KEY
      value: "TODO-set-from-nais-secret"
    - name: TRANSKRIPSJON_SERVICE_URL
      value: "https://TODO-litellm-xxxxxxxx-ew.a.run.app"
    - name: TRANSKRIPSJON_API_PATH
      value: "/v1/audio/transcriptions"
    - name: LLM_MODELL
      value: "borealis-12b"
    - name: WHISPER_MODELL
      value: NbAiLab/nb-whisper-medium
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: ECAPA_CACHE
      value: /app/.cache/speechbrain

  observability:
    autoInstrumentation:
      enabled: false
    logging:
      destinations:
        - id: loki
