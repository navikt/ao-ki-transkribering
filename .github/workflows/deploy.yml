name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: nais/docker-build-push@v0
        id: build
        with:
          team: ao-ki-taskforce
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          target: runtime
          build_args: REQUIREMENTS=requirements/api.txt

  build-backend:
    name: Build and push backend (ML worker) image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: nais/docker-build-push@v0
        id: build
        with:
          team: ao-ki-taskforce
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          build_args: REQUIREMENTS=requirements/worker-gpu.txt
          target: model-worker
          image_suffix: -worker

  deploy-dev:
    name: Deploy to dev
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/dev.yaml
          VAR: image=${{ needs.build-frontend.outputs.image }}

  deploy-prod:
    name: Deploy to prod
    needs: [build-frontend, deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/prod.yaml
          VAR: image=${{ needs.build-frontend.outputs.image }}
